<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>cena2-servicos</title>
<style>

  @font-face {
    font-family: 'Plus Jakarta Sans';
    src: local('Plus Jakarta Sans');
    font-weight: 400 800;
  }

  :root {
    --azul: #1E5AA8;
    --azul-escuro: #123663;
    --verde: #2E8B57;
    --cinza: #4B5563;
    --branco: #FFFFFF;
    --tinta: #0B1220;
    --papel: #F4F7FB;
    --linha: rgba(75, 85, 99, 0.18);
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans: 'Plus Jakarta Sans', 'Manrope', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--sans);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(30,90,168,0.14), transparent 60%),
      radial-gradient(900px 500px at 90% 10%, rgba(46,139,87,0.10), transparent 55%),
      var(--tinta);
    color: var(--branco);
    padding: 48px 24px 96px;
  }

  .masthead {
    max-width: 1160px;
    margin: 0 auto 44px;
  }

  .masthead .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--verde);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .masthead .eyebrow::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--verde);
    box-shadow: 0 0 0 3px rgba(46,139,87,0.25);
  }

  .masthead h1 {
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.12;
    margin: 0 0 12px;
    font-weight: 800;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .masthead h1 em {
    font-style: normal;
    background: linear-gradient(90deg, #6FA8DC, #7FD1A6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .masthead p {
    max-width: 62ch;
    color: rgba(255,255,255,0.68);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
  }

  .filmstrip {
    max-width: 100%;
    overflow-x: auto;
    padding: 8px 4px 28px;
    display: flex;
    gap: 40px;
    scroll-snap-type: x proximity;
  }

  .scene-block {
    flex: 0 0 auto;
    width: 320px;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .scene-tag {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
  .scene-tag b { color: var(--branco); font-size: 12px; letter-spacing: 0.06em; }

  /* ---- STORY FRAME 9:16 ---- */
  .frame {
    width: 320px;
    height: 569px;
    border-radius: 28px;
    position: relative;
    overflow: hidden;
    background: var(--branco);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 30px 60px -20px rgba(0,0,0,0.65),
      0 10px 24px -12px rgba(0,0,0,0.5);
    color: var(--cinza);
  }

  .frame .progress {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    height: 3px;
    display: flex;
    gap: 4px;
    z-index: 30;
  }
  .frame .progress span {
    flex: 1;
    border-radius: 2px;
    background: rgba(255,255,255,0.35);
    overflow: hidden;
  }
  .frame .progress span.on::after {
    content: "";
    display: block;
    height: 100%;
    width: 100%;
    background: #fff;
  }

  .frame .handle {
    position: absolute;
    top: 22px; left: 14px; right: 14px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .frame .handle .avatar {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--branco);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1.5px var(--azul);
  }
  .frame .handle .avatar img { width: 14px; }
  .frame .handle b { font-weight: 700; letter-spacing: 0.02em; }

  /* Scene 1 & 6: brand bookend frames */
  .frame.bookend {
    background: linear-gradient(160deg, #0F1C33 0%, #142C4E 46%, #163A2C 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 30px;
  }
  .frame.bookend .contour-bg {
    position: absolute;
    inset: -10%;
    background-image: url('__MAP_DATA_URI__');
    background-size: cover;
    background-position: center;
    opacity: 0.16;
    mix-blend-mode: screen;
    filter: saturate(1.4);
  }
  .frame.bookend .content { position: relative; z-index: 2; }

  .kicker {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8FD3AE;
    margin-bottom: 18px;
  }

  .hook {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.3;
    color: #fff;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0 0 22px;
  }

  .logo-mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .logo-mark img { width: 54px; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.35)); }
  .logo-mark .word {
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.14em;
    color: #fff;
  }
  .logo-mark .sub {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.55);
  }

  .final-cta {
    margin-top: 26px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--azul), var(--verde));
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.05em;
    box-shadow: 0 10px 26px -8px rgba(46,139,87,0.55);
  }
  .final-url {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.03em;
  }

  /* Scenes 2-5: device / print frames */
  .frame.device {
    display: flex;
    flex-direction: column;
    background: var(--papel);
  }
  .frame.device .top-safe {
    height: 92px;
    flex: 0 0 auto;
    background: linear-gradient(180deg, rgba(15,20,30,0.55), transparent);
    position: relative;
    z-index: 20;
  }
  .frame.device .badge-row {
    position: absolute;
    top: 50px; left: 14px; right: 14px;
    z-index: 25;
  }
  .frame.device .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.92);
    color: var(--azul-escuro);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 999px;
    box-shadow: 0 6px 16px -6px rgba(0,0,0,0.35);
  }
  .frame.device .badge::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--verde);
  }

  .print-area {
    flex: 1 1 auto;
    position: relative;
    margin: 0 10px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(75,85,99,0.15);
    background: #FFFFFF;
  }
  .print-area .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    gap: 10px;
  }
  .print-area .placeholder .pin {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px dashed var(--azul);
    display: flex; align-items: center; justify-content: center;
    color: var(--azul);
    font-size: 16px;
  }
  .print-area .placeholder .file {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--azul-escuro);
    background: rgba(30,90,168,0.08);
    padding: 4px 10px;
    border-radius: 6px;
  }
  .print-area .placeholder .instr {
    font-size: 11px;
    color: var(--cinza);
    max-width: 210px;
    line-height: 1.4;
  }
  .print-area img.real-shot {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: top center;
    background: #FFFFFF;
  }

  .frame.device .bottom-safe {
    flex: 0 0 auto;
    padding: 16px 18px 20px;
  }
  .frame.device .caption {
    font-size: 17px;
    font-weight: 700;
    color: var(--azul-escuro);
    line-height: 1.32;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .frame.device .caption .accent { color: var(--verde); }
  .frame.device .tagline {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--cinza);
    letter-spacing: 0.02em;
  }

  .scene-notes {
    font-size: 12.5px;
    color: rgba(255,255,255,0.55);
    line-height: 1.55;
    border-left: 2px solid rgba(255,255,255,0.14);
    padding-left: 12px;
  }
  .scene-notes b { color: rgba(255,255,255,0.85); }
  .scene-notes .swap {
    display: block;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: #8FD3AE;
  }

  .arrow {
    flex: 0 0 auto;
    align-self: center;
    color: rgba(255,255,255,0.25);
    font-size: 22px;
  }

  footer.legend {
    max-width: 1160px;
    margin: 40px auto 0;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
  }
  footer.legend .swatch {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: rgba(255,255,255,0.65);
  }
  footer.legend .dot {
    width: 16px; height: 16px; border-radius: 5px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
  }

  @media (max-width: 640px) {
    body { padding: 32px 16px 72px; }
    .filmstrip { gap: 26px; }
  }


  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: #0B1220;
  }
  .export-wrap {
    width: 320px;
    height: 569px;
    transform: scale(3.375);
    transform-origin: top left;
  }
  /* Instagram already renders its own progress bar, avatar and username —
     the mockup's fake chrome would double up, so it's hidden in the export. */
  .frame .progress, .frame .handle { display: none !important; }
  /* Full-bleed square canvas: no rounded corners or drop shadow at the edges. */
  .frame { border-radius: 0 !important; box-shadow: none !important; }

</style>
</head>
